    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "knowsAbout": ["ASP.NET Core", "C#", "Entity Framework Core", "SQL Server", "PostgreSQL", "React", "TypeScript", "Clean Architecture", "CQRS"],
        "alumniOf": [{ "@type": "CollegeOrUniversity", "name": "Al-Aqsa University" }, { "@type": "EducationalOrganization", "name": "Gaza Training College" }],
        "address": { "@type": "PostalAddress", "addressLocality": "Al-Maghazi, Gaza", "addressCountry": "PS" },
        "sameAs": ["https://github.com/EngOmarHamad", "https://www.linkedin.com/in/omar-hamad-521911274"]
      }
    </script>

    <script>
      // Runs before first paint: theme class, language direction and intro gating.
      ;(function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          d.classList.remove('light', 'dark')
          d.classList.add(t)
          if (localStorage.getItem('portfolio-lang') === 'ar') { d.lang = 'ar'; d.dir = 'rtl' }
        } catch (e) {}
        var p = location.pathname
        var skip = p.indexOf('/admin') === 0 || p === '/cv'
        try {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('oh:intro')) skip = true
          if (!skip) sessionStorage.setItem('oh:intro', '1')
        } catch (e) { skip = true }
        d.classList.add(skip ? 'intro-skip' : 'intro-run')
      })()
    </script>

    <style>
      #intro { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
      html.intro-skip #intro { display: none; }
      html.intro-run body { overflow: hidden; }
      .intro-half { position: absolute; left: 0; right: 0; height: 50.5%; background: var(--bg, #0a0e14); transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1); }
      .intro-top { top: 0; }
      .intro-bottom { bottom: 0; }
      .intro-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; transition: opacity 250ms cubic-bezier(0.22, 1, 0.36, 1); }
      .intro-core svg { width: 120px; height: 64px; overflow: visible; }
      .intro-core .s { fill: none; stroke: var(--text, #e6eaf0); stroke-width: 2; stroke-linecap: square; stroke-dasharray: 1; stroke-dashoffset: 1; animation: intro-draw 800ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .intro-core .a { stroke: var(--accent, #ffb547); animation-delay: 250ms; }
      .intro-core .n { fill: var(--accent, #ffb547); opacity: 0; animation: intro-dot 200ms 700ms forwards; }
      .intro-count { font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.2em; color: var(--muted, #8b95a7); font-variant-numeric: tabular-nums; }
      html.intro-done .intro-top { transform: translateY(-100%); }
      html.intro-done .intro-bottom { transform: translateY(100%); }
      html.intro-done .intro-core { opacity: 0; }
      @keyframes intro-draw { to { stroke-dashoffset: 0; } }
      @keyframes intro-dot { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-half intro-top"></div>
      <div class="intro-half intro-bottom"></div>
      <div class="intro-core">
        <svg viewBox="0 0 120 64">
          <circle class="s" cx="30" cy="32" r="23" pathLength="1" />
          <path class="s" d="M74 9V55M106 9V55M74 32H106" pathLength="1" />
          <path class="s a" d="M53 32H74" pathLength="1" />
          <circle class="n" cx="53" cy="32" r="2.5" />
          <circle class="n" cx="74" cy="32" r="2.5" />
        </svg>
        <span class="intro-count" id="intro-count">000</span>
      </div>
    </div>
    <script>
      ;(function () {
        var d = document.documentElement
        if (!d.classList.contains('intro-run')) { window.__ohIntroDone = true; return }
        var el = document.getElementById('intro-count')
        var start = performance.now()
        var DURATION = 850
        function finish() {
          d.classList.add('intro-done')
          d.classList.remove('intro-run')
          window.__ohIntroDone = true
          window.dispatchEvent(new Event('oh:intro-done'))
          setTimeout(function () { var n = document.getElementById('intro'); if (n) n.remove() }, 700)
        }
        function tick(now) {
          var t = Math.min(1, (now - start) / DURATION)
          var eased = 1 - Math.pow(1 - t, 3)
          el.textContent = String(Math.round(eased * 100)).padStart(3, '0')
          if (t < 1) requestAnimationFrame(tick)
          else setTimeout(finish, 120)
        }
        requestAnimationFrame(tick)
      })()
    </script>
    <noscript><style>#intro { display: none; } html.intro-run body { overflow: auto; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
